 const top=list.slice().sort((a,b)=>b.sc-a.sc||a.t-b.t).slice(0,10);return `<table class="stats"><thead><tr><th>#</th><th>Name</th><th>Punkte</th><th>Richtig</th></tr></thead><tbody>${top.map((e,i)=>`<tr class="${e.p===me?'me':''}"><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td><td>${esc(clean(e.n)||'?')}</td><td><b>${num(e.sc)}</b></td><td>${num(e.cr)}/${num(e.tot)}</td></tr>`).join('')}</tbody></table>`}
async function showBoard(){const D=dailyCfg();modal(`<button class="iconbtn x" onclick="closeModal()">${ic('x')}</button><h2>Tagesrennen · ${D.lvl}</h2><p class="muted" style="margin-top:4px">${D.d} · ${TRACKS[D.cfg.city]} · alle fahren heute dieselbe Strecke mit denselben Fragen</p><div id="dlbm" style="margin-top:12px"><p class="netnote">Lade Rangliste …</p></div>`);
 const l=await dailyBoard(D.d,D.lvl,null);const el=document.getElementById('dlbm');if(el)el.innerHTML=boardHTML(l,pid())}
function fehler(){if(!G||!G.mist.length)return;const cfg=Object.assign({},G.cfg),seen=new Set(),u=[];G.mist.forEach(m=>{if(m.qo&&!seen.has(m.qo.text)){seen.add(m.qo.text);u.push(m.qo)}});
 const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const s1=sh(u),s2=sh(u);if(u.length>1&&s2[0]===s1[s1.length-1])s2.push(s2.shift());let list=[...s1,...s2];while(list.length<3)list.push(...sh(u));list=list.slice(0,10).map(q=>Object.assign({},q,{opts:sh(q.opts)}));
 stopRace();startRace({mode:'solo',cfg,seed:1+Math.floor(Math.random()*2e9),goIn:4000,qs:list})}
function again(){if(G.daily){stopRace();return daily()}const cfg=Object.assign({},G.cfg);if(G.fehler)cfg.len=ST.cfg.len;stopRace();startRace({mode:'solo',cfg,seed:1+Math.floor(Math.random()*2e9),goIn:4000})}
function solo(){unlockAudio();saveST();startRace({mode:'solo',cfg:Object.assign({},ST.cfg),seed:1+Math.floor(Math.random()*2e9),goIn:4500})}

function specStart(seed){const cfg=Object.assign({},ST.cfg),n=nGates(cfg),gp=gapOf(cfg);stopShow();
 SPEC={seed,cfg,qs:buildQs(cfg,seed,n),gateS:null,goAt:performance.now()+6000,ph:'cd',t0:0,firstFin:0,rec:new Map(),done:false,iv:0};
 V().innerHTML=`<div class="wrap view-in spec"><div class="sp-head panel"><div><small>RAUM-CODE</small><b class="sp-code">${esc(NET.code)}</b></div><div class="sp-info"><b>${TRACKS[cfg.city]} · ${(cfg.len/1000).toFixed(1)} km · ${srcName(cfg)}</b><span id="spPh">Countdown …</span></div><div class="sp-btns"><button class="btn glass" onclick="Race3D.specEnd()">${ic('flag')} Rennen beenden</button></div></div>
  <div class="sp-grid"><section class="panel"><div class="lbl">Live-Rennen</div><div id="spTrack" class="sp-track"></div></section><section class="panel"><div class="lbl">Antworten pro Tor (live)</div><div id="spGates" class="sp-gates"></div></section></div></div>`;
 SPEC.gateS=gatePos(cfg,SPEC.qs);SPEC.iv=setInterval(specTick,250);specTick()}
function specStop(){if(SPEC){clearInterval(SPEC.iv);SPEC=null}}
function specTick(){const S=SPEC;if(!S||!NET.r)return;const now=performance.now();if(S.ph==='cd'&&now>=S.goAt){S.ph='race';S.t0=now;sBeep(true)}
 NET.r.peers().forEach(p=>{const pr=p.presence;if(!pr||pr.sp||pr.rs!==S.seed)return;const kk=num(pr.k)%NV,tm=num(pr.tm)%2;S.rec.set(p.peer,{n:clean(pr.n)||'Spieler',col:S.cfg.team?TEAMS[tm].c:vcol(kk,pr.c),s:num(pr.s),f:num(pr.f),sc:num(pr.sc),cr:num(pr.cr),a:String(pr.a||'').slice(0,40),tm,on:1})});
 const live=new Set(NET.r.peers().map(p=>p.peer));S.rec.forEach((r,k)=>{r.on=live.has(k)});
 const rs=[...S.rec.values()];if(!S.done&&S.ph==='race'){if(rs.some(r=>r.f>0)&&!S.firstFin)S.firstFin=now;const act=rs.filter(r=>r.on);if((act.length&&act.every(r=>r.f>0))||(S.firstFin&&now-S.firstFin>45000))return specEnd()}
 NET.r.presence({ph:S.done?'res':S.ph,go:Math.max(0,Math.round(S.goAt-now)),seed:S.seed}).catch(()=>{});if(S.done)return;
 const ph=document.getElementById('spPh');if(!ph){return}
 ph.textContent=S.ph==='cd'?`Start in ${Math.ceil((S.goAt-now)/1000)} …`:`Läuft · ${fmtT(now-S.t0)} · ${rs.filter(r=>r.f).length}/${rs.length} im Ziel`;
 const ord=rs.slice().sort((a,b)=>(a.f&&b.f)?a.f-b.f:a.f?-1:b.f?1:b.s-a.s),L=S.cfg.len;
 let tt='';if(S.cfg.team){const t=[0,0];rs.forEach(r=>t[r.tm]+=r.sc);tt=`<div class="teamsc big">${TEAMS.map((x,i)=>`<span style="background:${x.c}">${x.n} <b>${t[i]}</b></span>`).join('')}</div>`}
 document.getElementById('spTrack').innerHTML=tt+(ord.length?ord.map((r,i)=>`<div class="sp-row ${r.on?'':'off'}"><b class="p">${i+1}</b><span class="n"><i style="background:${r.col}"></i>${esc(r.n)}</span><div class="bar">${S.gateS.map(g=>`<em style="left:${g/L*100}%"></em>`).join('')}<u style="left:${Math.max(0,Math.min(100,r.s/L*100))}%;background:${r.col}"></u></div><small>${r.f?fmtT(r.f):r.cr+'/'+r.a.length}</small></div>`).join(''):'<p class="netnote">Warte auf Fahrer …</p>');
 document.getElementById('spGates').innerHTML=S.qs.map((q,k)=>{const st=gateStat(k);const cur=rs.some(r=>r.a.length===k&&!r.f);return `<div class="sg ${cur?'cur':''} ${st.n?'':'empty'}"><div class="h"><b>Tor ${k+1}</b><span>${st.n?Math.round(st.ok/st.n*100)+'% richtig':'–'}</span></div><div class="q">${fmt(q.text)}</div><div class="b"><i style="width:${st.n?st.ok/st.n*100:0}%"></i></div><small>✓ ${esc(q.right)}${st.top?` · häufigster Fehler: <em>${esc(st.top)}</em> (${st.topN})`:''}</small></div>`}).join('')}
function gateStat(k){const S=SPEC;let n=0,ok=0;const w={};S.rec.forEach(r=>{const ch=r.a[k];if(!ch)return;n++;if(ch>='A'&&ch<='Z')ok++;else{const o=S.qs[k].opts[ch.charCodeAt(0)-97];if(o!=null)w[o]=(w[o]||0)+1}});const top=Object.entries(w).sort((a,b)=>b[1]-a[1])[0];return{n,ok,top:top&&top[0],topN:top&&top[1]}}
function specEnd(){const S=SPEC;if(!S||S.done)return;S.done=true;NET.r&&NET.r.presence({ph:'res'}).catch(()=>{});sFanfare();FX.big();
 const rs=[...S.rec.values()].sort((a,b)=>(a.f&&b.f)?a.f-b.f:a.f?-1:b.f?1:b.s-a.s);const tot=S.qs.length;
 const gst=S.qs.map((q,k)=>Object.assign({q,k},gateStat(k)));const hard=gst.filter(g=>g.n).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,3);
 const avg=rs.length?Math.round(rs.reduce((a,r)=>a+(r.a.length?r.cr/r.a.length:0),0)/rs.length*100):0;
 S.report=`Blitz Rally 3D – Klassenbericht\n${TRACKS[S.cfg.city]} · ${srcName(S.cfg)} · ${tot} Fragen · Raum ${NET.code}\nDurchschnitt: ${avg}% richtig\n\nRANGLISTE\n`+rs.map((r,i)=>`${i+1}. ${r.n} – ${r.cr}/${r.a.length} richtig – ${r.sc} Punkte${r.f?' – '+fmtT(r.f):''}`).join('\n')+`\n\nFRAGEN\n`+gst.map(g=>`Tor ${g.k+1}: ${g.q.text.replace(/<[^>]+>|\*\*/g,'')} → ${g.q.right} | ${g.n?Math.round(g.ok/g.n*100):0}% richtig${g.top?' | Fehler: '+g.top:''}`).join('\n');
 V().innerHTML=`<div class="wrap view-in spec"><div class="sp-head panel"><div><small>RAUM-CODE</small><b class="sp-code">${esc(NET.code)}</b></div><div class="sp-info"><b>Klassenbericht · ${TRACKS[S.cfg.city]} · ${srcName(S.cfg)}</b><span>${rs.length} Fahrer · Ø ${avg}% richtig</span></div>
  <div class="sp-btns"><button class="btn glass" onclick="Race3D.copyRep()">Bericht kopieren</button><button class="btn gold" onclick="Race3D.specNew()">${ic('refresh')} Neues Rennen</button></div></div>
  <div class="sp-grid"><section class="panel"><div class="lbl">Rangliste</div>${S.cfg.team?(()=>{const t=[0,0];rs.forEach(r=>t[r.tm]+=r.sc);return `<div class="teamsc big">${TEAMS.map((x,i)=>`<span style="background:${x.c}">${x.n} <b>${t[i]}</b>${t[i]>t[1-i]?' 🏆':''}</span>`).join('')}</div>`})():''}
   <table class="stats"><thead><tr><th>#</th><th>Name</th><th>Richtig</th><th>Punkte</th><th>Zeit</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td><span style="color:${r.col}">●</span> ${esc(r.n)}</td><td><b>${r.cr}/${r.a.length}</b> <small class="muted">${r.a.length?Math.round(r.cr/r.a.length*100):0}%</small></td><td>${r.sc}</td><td class="mono">${r.f?fmtT(r.f):'–'}</td></tr>`).join('')||'<tr><td colspan="5">Keine Fahrer</td></tr>'}</tbody></table>
   ${hard.length?`<div class="lbl" style="margin-top:16px">Schwierigste Fragen – im Unterricht wiederholen</div>${hard.map(g=>`<div class="sg hard"><div class="h"><b>Tor ${g.k+1}</b><span>${Math.round(g.ok/g.n*100)}% richtig</span></div><div class="q">${fmt(g.q.text)}</div><small>✓ ${esc(g.q.right)}${g.top?` · oft gewählt: <em>${esc(g.top)}</em>`:''}</small>${g.q.tip?`<small class="muted">${esc(g.q.tip)}</small>`:''}</div>`).join('')}`:''}</section>
  <section class="panel"><div class="lbl">Alle Fragen</div><div class="sp-gates">${gst.map(g=>`<div class="sg ${g.n?'':'empty'}"><div class="h"><b>Tor ${g.k+1}</b><span>${g.n?Math.round(g.ok/g.n*100)+'%':'–'}</span></div><div class="q">${fmt(g.q.text)}</div><div class="b"><i style="width:${g.n?g.ok/g.n*100:0}%"></i></div><small>✓ ${esc(g.q.right)}${g.top?` · Fehler: <em>${esc(g.top)}</em> (${g.topN})`:''}</small></div>`).join('')}</div></section></div></div>`}

function startShow(){stopShow();const cv=document.getElementById('r3show');if(!cv)return;loadThree().then(()=>{loadModels();if(!document.getElementById('r3show')||G)return;
 const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(24,1,.1,200);sc.background=new THREE.Color('#0b1430');
 const env=new THREE.Scene();const sg=new THREE.SphereGeometry(50,16,8);const cols=[];for(let i=0;i<sg.attributes.position.count;i++){const y=sg.attributes.position.getY(i)/50;const c=new THREE.Color().setHSL(.6,.6,Math.max(.05,.25+y*.5));cols.push(c.r,c.g,c.b)}sg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));env.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 const lb=new THREE.Mesh(new THREE.BoxGeometry(20,1,4),new THREE.MeshBasicMaterial({color:0xffffff}));lb.position.set(0,20,0);env.add(lb);sc.environment=new THREE.PMREMGenerator(r).fromScene(env,.02).texture;
 sc.add(new THREE.HemisphereLight(0xbcd8ff,0x101020,.8));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(5,8,6);sc.add(dl);
 const fl=new THREE.Mesh(new THREE.CircleGeometry(4.2,48),new THREE.MeshStandardMaterial({color:0x070b22,metalness:0,roughness:.95}));fl.rotation.x=-Math.PI/2;sc.add(fl);
 const ring=new THREE.Mesh(new THREE.RingGeometry(4.1,4.3,64),new THREE.MeshBasicMaterial({color:0x5BC8FA}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;sc.add(ring);
 let car=null,ck='';const S={r,sc,cam,raf:0};SHOW=S;
 const step=t=>{if(SHOW!==S)return;const key=ST.car+'|'+ST.col+'|'+Object.keys(GLB).length;if(key!==ck){ck=key;if(car)sc.remove(car);car=makeCar(ST.car,vcol(ST.car,ST.col),null);sc.add(car)}
  const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r.getPixelRatio())){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  const a=t*.0004,wide=cam.aspect>1.6&&innerWidth>760;cam.fov=cam.aspect<1.4?34:24;cam.updateProjectionMatrix();cam.position.set(Math.sin(a)*13,3.4,Math.cos(a)*13);cam.lookAt(0,.8,0);if(wide){cam.setViewOffset(w,h,-w*.27,0,w,h)}else cam.clearViewOffset();if(car.userData.glb)car.userData.wheels.forEach(wh=>wh.rotation.x+=.03);else car.userData.wheels.forEach(wh=>wh.children.forEach(c=>c.rotation.x+=.03));r.render(sc,cam);S.raf=requestAnimationFrame(step)};S.raf=requestAnimationFrame(step)}).catch(()=>{})}
function stopShow(){if(SHOW){cancelAnimationFrame(SHOW.raf);try{SHOW.r.dispose();SHOW.r.forceContextLoss()}catch(e){}SHOW=null}}

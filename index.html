<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blitz Rally 3D – Deutsch lernen im Rennen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --b1:#2529D8;--b2:#0389FF;--b3:#5BC8FA;--ink:#0F172A;--gold:#FFC93C;--gold2:#FFB020;--ok:#16C47F;--bad:#FF4D6D;
 --txt:#F3F6FF;--muted:rgba(225,232,255,.66);--faint:rgba(225,232,255,.42);
 --glass:rgba(12,18,38,.58);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.14);
 --r:22px;--sh:0 24px 60px rgba(2,6,23,.45),inset 0 1px 0 rgba(255,255,255,.08);
 --blur:saturate(150%) blur(18px);
}
html,body{min-height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--txt);background:#050914;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.h,.num{font-family:Unbounded,Manrope,sans-serif}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}.ic.xl{width:34px;height:34px}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(5,9,20,.35) 0%,rgba(5,9,20,0) 18%,rgba(5,9,20,0) 34%,rgba(5,9,20,.55) 56%,rgba(5,9,20,.88) 78%,#050914 100%)}
body.v-city .scrim{background:linear-gradient(180deg,rgba(5,9,20,.3) 0%,rgba(5,9,20,0) 20%,rgba(5,9,20,0) 44%,rgba(5,9,20,.7) 66%,#050914 92%)}
body.v-map .scrim,body.v-ach .scrim,body.v-race .scrim{background:linear-gradient(180deg,rgba(5,9,20,.55),rgba(5,9,20,.8) 40%,#050914 90%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
body.racing #app,body.racing #bg,body.racing .scrim{display:none}

/* ---------- top bar ---------- */
.tricolor{height:3px;background:linear-gradient(90deg,#000 0 33.33%,#DD0000 33.33% 66.66%,#FFCE00 66.66%)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px clamp(12px,3vw,28px);
 background:linear-gradient(180deg,rgba(7,11,26,.72),rgba(7,11,26,.42));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.brand .mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--b1),var(--b2) 60%,var(--b3));display:grid;place-items:center;box-shadow:0 6px 18px rgba(3,137,255,.45)}
.brand .mk .ic{color:#fff}
.brand b{font:800 15px Unbounded,Manrope,sans-serif;letter-spacing:.3px;display:block;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.nav{display:flex;gap:4px;margin-left:12px;background:rgba(255,255,255,.05);padding:4px;border-radius:14px;border:1px solid rgba(255,255,255,.07)}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 13px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.18s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button.on{color:#fff;background:linear-gradient(135deg,rgba(37,41,216,.9),rgba(3,137,255,.9));box-shadow:0 4px 14px rgba(3,137,255,.35)}
.tb-sp{flex:1}
.pchip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.avatar{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 13px Unbounded,Manrope,sans-serif;color:#fff;background:linear-gradient(135deg,#2529D8,#0389FF)}
.avatar .lv{position:absolute;right:-5px;bottom:-4px;background:var(--gold);color:var(--ink);font:800 10px Unbounded,Manrope,sans-serif;border-radius:8px;padding:1px 5px;border:2px solid #0b1124}
.pchip .meta{line-height:1.15}
.pchip .meta b{font-size:13px;display:block}
.xpbar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;width:110px;margin-top:3px}
.xpbar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 10px rgba(255,201,60,.6);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.stat-pill{display:flex;align-items:center;gap:6px;font:800 13px Unbounded,Manrope,sans-serif;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.stat-pill .ic{color:var(--gold)}
.stat-pill.fire .ic{color:#FF7A45}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.bnav{display:none}

/* ---------- layout ---------- */
#view{flex:1;width:100%}
.wrap{width:100%;max-width:1360px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}
.view-in{animation:viewIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}}
.panel{position:relative;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 40%)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph h3{font:700 15px Unbounded,Manrope,sans-serif;letter-spacing:.2px}
.ph .ic{color:var(--b3)}
.ph .sp{flex:1}
.ph a,.link{font-size:13px;font-weight:700;color:var(--b3);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;background:none;border:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--b3)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 20px;font:700 15px Manrope,Manrope,system-ui,sans-serif;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2) 60%,#3fb2f5);box-shadow:0 10px 28px rgba(3,137,255,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{box-shadow:0 14px 36px rgba(3,137,255,.6),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-1px)}
.btn.gold{color:var(--ink);background:linear-gradient(135deg,#FFE27A,var(--gold) 50%,var(--gold2));box-shadow:0 10px 28px rgba(255,176,32,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn.glass:hover{background:rgba(255,255,255,.16)}
.btn.lg{padding:16px 26px;font-size:16px;border-radius:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(10,15,32,.45);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:700;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chip .ic{width:16px;height:16px}

/* ---------- hero ---------- */
.hero{min-height:clamp(300px,46vh,520px);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 0 26px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hero h1{font:800 clamp(32px,5.6vw,64px)/1.02 Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.5px;text-shadow:0 6px 40px rgba(0,0,0,.55)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fff,var(--b3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:clamp(15px,1.6vw,18px);color:rgba(240,244,255,.86);margin-top:10px;max-width:620px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding-bottom:30px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lcard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:#0b1224;border:1px solid rgba(255,255,255,.1);aspect-ratio:16/11;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;isolation:isolate}
.lcard .thumb{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.lcard .thumb svg{width:100%;height:100%;display:block}
.lcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,20,0) 30%,rgba(5,9,20,.55) 62%,rgba(5,9,20,.95));z-index:1}
.lcard:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(91,200,250,.5);border-color:rgba(91,200,250,.5)}
.lcard:hover .thumb{transform:scale(1.06)}
.lcard .body{position:absolute;left:0;right:0;bottom:0;padding:14px;z-index:2}
.lcard .tag{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}
.lcard .tag span{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 9px;border-radius:999px;background:rgba(5,9,20,.6);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.lcard .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(37,41,216,.95),rgba(3,137,255,.95));box-shadow:0 6px 16px rgba(3,137,255,.4);margin-bottom:8px}
.lcard h4{font:700 17px Unbounded,Manrope,sans-serif;line-height:1.15}
.lcard .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.lcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stars{display:flex;gap:2px}
.stars .ic{width:16px;height:16px;fill:rgba(255,255,255,.18);stroke:none}
.stars .ic.on{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(255,201,60,.7))}
.lcard .best{font:700 11px Unbounded,Manrope,sans-serif;color:var(--muted)}
.lcard.locked{cursor:not-allowed}
.lcard.locked .thumb{filter:grayscale(.85) brightness(.45) blur(1px)}
.lcard.locked:hover{transform:none;box-shadow:none;border-color:rgba(255,255,255,.1)}
.lcard.locked:hover .thumb{transform:none}
.lockov{position:absolute;inset:0 0 38% 0;z-index:3;display:grid;place-items:center;text-align:center}
.lockov .lk{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(5,9,20,.7);border:1px solid rgba(255,255,255,.2);margin:0 auto 8px}
.lockov small{font-weight:800;font-size:12px;color:var(--muted)}
.lcard.rec{box-shadow:0 0 0 2px var(--gold),0 18px 40px rgba(255,176,32,.25)}
.lcard.rec .tag .r{background:var(--gold);color:var(--ink);border-color:transparent}
.lcard.big{aspect-ratio:16/9}
.lcard.big h4{font-size:22px}

/* profile */
.prof{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#2529D8,#0389FF);box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.ring .in b{font:800 22px Unbounded,Manrope,sans-serif;line-height:1}
.ring .in small{font-size:9px;font-weight:800;letter-spacing:1.2px;opacity:.85}
.prof h2{font:700 19px Unbounded,Manrope,sans-serif}
.prof .lvln{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.prof .xpbar{width:100%;height:8px;margin-top:8px}
.prof .xpt{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font:800 18px Unbounded,Manrope,sans-serif}
.kpi small{font-size:11px;color:var(--muted);font-weight:700}
.kpi .ic{color:var(--gold);margin-bottom:4px}
.kpi.fire .ic{color:#FF7A45}

/* missions */
.mis{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-top:10px}
.mis:first-of-type{margin-top:0}
.mis .mi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(91,200,250,.12);color:var(--b3);border:1px solid rgba(91,200,250,.25)}
.mis .mb{flex:1;min-width:0}
.mis .mb b{font-size:14px;display:block}
.mis .pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:7px}
.mis .pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--b2),var(--b3));transition:width .8s}
.mis .pt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px;display:flex;justify-content:space-between}
.mis.done .mi{background:rgba(22,196,127,.15);color:var(--ok);border-color:rgba(22,196,127,.35)}
.mis.done .pbar i{background:linear-gradient(90deg,#10b981,#34d399)}
.claim{border:0;border-radius:11px;padding:9px 12px;font:800 12px Unbounded,Manrope,sans-serif;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,#FFE27A,var(--gold));box-shadow:0 6px 16px rgba(255,176,32,.35);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 26px rgba(255,201,60,.7)}}
.claimed{font:800 11px Unbounded,Manrope,sans-serif;color:var(--ok);display:flex;align-items:center;gap:4px}

/* progress */
.prog-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.pring{position:relative;width:78px;height:78px;margin:0 auto}
.pring svg{width:78px;height:78px;transform:rotate(-90deg)}
.pring b{position:absolute;inset:0;display:grid;place-items:center;font:800 16px Unbounded,Manrope,sans-serif}
.prog-rings small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.citybars{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.cb{display:grid;grid-template-columns:88px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;font-weight:700}
.cb .t{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.cb .t i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.cb span:last-child{color:var(--muted);text-align:right;font-family:Unbounded,Manrope,sans-serif;font-size:11px}
.cb.lock{opacity:.45}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.badge{position:relative;text-align:center;cursor:default}
.badge .md{width:62px;height:68px;margin:0 auto;position:relative;display:grid;place-items:center}
.badge .md svg.hex{position:absolute;inset:0;width:100%;height:100%}
.badge .md .ic{position:relative;width:26px;height:26px;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.badge small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.2}
.badge.off .md{filter:grayscale(1) brightness(.5);opacity:.6}
.badge.off .md .ic{opacity:.55}
.badge .tip{display:none}

/* race card */
.racecard{overflow:hidden;padding:0}
.racecard canvas{display:block;width:100%;height:150px}
.racecard .rb{padding:16px}
.racecard h3{font:700 17px Unbounded,Manrope,sans-serif}
.racecard p{font-size:13px;color:var(--muted);margin:6px 0 12px;line-height:1.45}

/* ---------- map ---------- */
.mapwrap{position:relative}
.desvg{width:100%;height:auto;display:block;max-height:640px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.city-node{cursor:pointer}
.city-node .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.city-node:hover .dot{filter:brightness(1.3)}
.route{stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.12);background:#0b1224 center/cover no-repeat;transition:.25s}
.ccard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(5,9,20,.92))}
.ccard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.5);border-color:rgba(91,200,250,.5)}
.ccard .cb2{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.ccard h4{font:800 20px Unbounded,Manrope,sans-serif}
.ccard small{font-size:12px;color:var(--muted);font-weight:700}
.ccard .lvl{position:absolute;top:12px;right:12px;z-index:2}
.ccard.locked{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.ccard.cur{box-shadow:0 0 0 2px var(--b3)}

/* ---------- city ---------- */
.city-hero{min-height:clamp(320px,52vh,600px);display:flex;flex-direction:column;justify-content:flex-end;padding:20px 0 26px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--b3);cursor:pointer}
.city-hero h1{font:800 clamp(40px,8vw,96px)/.95 Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-1px;text-shadow:0 8px 50px rgba(0,0,0,.6)}
.city-hero p{font-size:clamp(15px,1.8vw,19px);font-weight:600;color:rgba(240,244,255,.88);margin-top:10px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.city-hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.city-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding-bottom:30px}
.fact{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.fact:first-of-type{border-top:0;padding-top:0}
.fact .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px Unbounded,Manrope,sans-serif;background:rgba(91,200,250,.15);color:var(--b3)}
.fact p{font-size:14px;line-height:1.5}
.travel{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-top:10px;cursor:pointer;transition:.2s}
.travel:hover{background:rgba(255,255,255,.08)}
.travel .th{width:64px;height:44px;border-radius:10px;background:#111 center/cover;flex:none}
.travel b{font-size:14px;display:block}
.travel small{font-size:12px;color:var(--muted);font-weight:600}
.travel .sp{flex:1}
.travel.locked{opacity:.5;cursor:default}

/* ---------- challenge ---------- */
.ch{position:fixed;inset:0;z-index:60;overflow:hidden;background:#05070f}
.ch .scene{position:absolute;inset:0;transition:filter .6s}
.ch .scene svg{width:100%;height:100%;display:block}
.ch.done .scene{filter:blur(8px) brightness(.55)}
.ch .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.45)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 55%,rgba(0,0,0,.55))}
.npc{position:absolute;right:max(2vw,calc(50% - 760px));bottom:0;height:min(80vh,760px);aspect-ratio:2/3;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.npc svg{width:100%;height:100%;display:block;overflow:visible}
.npc.enter{transform:translateX(30px);opacity:0}
.npc .hd{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(.8deg)}}
.npc .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.npc .mouth{transform-box:fill-box;transform-origin:center top}
.npc.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(1.9)}}
.npc .torso{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.008)}}
.npc.happy .hd{animation:nod .5s ease-in-out 2}
@keyframes nod{50%{transform:translateY(6px)}}
.npc.sad .hd{animation:shakehd .45s ease-in-out}
@keyframes shakehd{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

.chud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px clamp(10px,2.4vw,24px)}
.chud .gl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:rgba(8,12,28,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chud .ttl b{font:700 14px Unbounded,Manrope,sans-serif;display:block;line-height:1.15}
.chud .ttl small{font-size:11.5px;color:var(--muted);font-weight:700}
.chud .sp{flex:1}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:6px;border-radius:6px;background:rgba(255,255,255,.18);transition:.3s}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
.timer{position:relative;width:46px;height:46px}
.timer svg{width:46px;height:46px;transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font:800 15px Unbounded,Manrope,sans-serif}
.timer.low span{color:var(--bad);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.score b{font:800 18px Unbounded,Manrope,sans-serif;color:var(--gold)}
.score small{display:block;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.streak{font:800 14px Unbounded,Manrope,sans-serif;color:#FF8A4C;display:flex;align-items:center;gap:4px}

.dlg{position:absolute;z-index:6;left:max(2.5vw,calc(50% - 720px));bottom:clamp(12px,3vh,30px);width:min(860px,60vw);
 background:linear-gradient(180deg,rgba(14,20,42,.78),rgba(8,12,28,.86));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
 border:1px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);padding:18px 20px 18px;animation:dlgIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px)}}
.dlg.gold{border-color:rgba(255,201,60,.8);box-shadow:0 0 0 1px rgba(255,201,60,.6),0 0 60px rgba(255,201,60,.25),0 30px 80px rgba(0,0,0,.55)}
.spk{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.spk .nm{font:700 13px Unbounded,Manrope,sans-serif;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 4px 14px rgba(3,137,255,.4)}
.spk .role{font-size:12px;color:var(--muted);font-weight:700}
.spk .sp{flex:1}
.spk .tg{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:rgba(91,200,250,.14);color:var(--b3)}
.spk .tg.g{background:rgba(255,138,76,.16);color:#FFA26B}
.spk .tg.gold{background:var(--gold);color:var(--ink)}
.say{font-size:clamp(18px,2vw,23px);font-weight:700;line-height:1.42;min-height:1.4em}
.say .gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--b3);margin:0 4px;transform:translateY(-4px)}
.say .cur{display:inline-block;width:2px;height:1em;background:var(--b3);margin-left:2px;vertical-align:-2px;animation:cur .7s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.ann{display:flex;gap:12px;align-items:flex-start;background:#0a1730;border:1px solid rgba(91,200,250,.25);border-radius:16px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#FFD34D;font-size:clamp(15px,1.7vw,18px);line-height:1.45;box-shadow:inset 0 0 30px rgba(3,137,255,.15)}
.ann .ic{color:var(--b3);margin-top:3px}
.qline{margin-top:12px;font-size:14px;font-weight:800;color:var(--b3);display:flex;align-items:center;gap:8px}
.wordcard{margin:6px 0 2px;text-align:center;font:800 clamp(34px,5vw,58px) Unbounded,Manrope,system-ui,sans-serif;letter-spacing:-.5px;text-shadow:0 6px 30px rgba(3,137,255,.35)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts2.one{grid-template-columns:1fr}
.o2{position:relative;text-align:left;padding:14px 16px 14px 48px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font-weight:700;font-size:clamp(15px,1.5vw,17px);line-height:1.3;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;color:#fff}
.o2:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:rgba(91,200,250,.6);transform:translateY(-1px);box-shadow:0 8px 22px rgba(3,137,255,.2)}
.o2 .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font:800 12px Unbounded,Manrope,sans-serif;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.o2:disabled{cursor:default}
.o2.right{background:rgba(22,196,127,.22);border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 26px rgba(22,196,127,.35)}
.o2.right .k{background:var(--ok);border-color:var(--ok)}
.o2.wrong{background:rgba(255,77,109,.2);border-color:var(--bad)}
.o2.wrong .k{background:var(--bad);border-color:var(--bad)}
.o2.gone{opacity:.15;pointer-events:none}
.opts2.art{grid-template-columns:repeat(3,1fr)}
.opts2.art .o2{text-align:center;padding:18px 8px;font:800 clamp(20px,2.4vw,28px) Unbounded,Manrope,system-ui,sans-serif;border:0}
.opts2.art .o2.der{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}.opts2.art .o2.die{background:linear-gradient(135deg,#be123c,#f43f5e)}.opts2.art .o2.das{background:linear-gradient(135deg,#047857,#10b981)}
.opts2.art .o2.right{box-shadow:0 0 0 3px #fff,0 0 30px rgba(255,255,255,.5)}
.opts2.art .o2.wrong{filter:grayscale(.8);opacity:.5}
.slot{min-height:58px;border:2px dashed rgba(255,255,255,.22);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;transition:.2s}
.slot:empty::before{content:"Tippe die Wörter in der richtigen Reihenfolge";color:var(--faint);font-weight:700;font-size:13.5px;padding-left:6px}
.slot.ok{border:2px solid var(--ok);background:rgba(22,196,127,.12)}.slot.bad{border:2px solid var(--bad);background:rgba(255,77,109,.12)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;min-height:44px}
.tile{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tile.used{visibility:hidden}
.slot .tile{background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent}
.punct{font:800 20px Manrope,Manrope,system-ui,sans-serif}
.acts{display:flex;align-items:center;gap:8px;margin-top:12px}
.acts .sp{flex:1}
.help{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-weight:800;font-size:13px;cursor:pointer}
.help:disabled{opacity:.3;cursor:default}
.help .ic{width:16px;height:16px;color:var(--gold)}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;animation:dlgIn .3s both;display:flex;gap:12px;align-items:flex-start}
.fb.ok{background:rgba(22,196,127,.14);border:1px solid rgba(22,196,127,.5)}
.fb.bad{background:rgba(255,77,109,.13);border:1px solid rgba(255,77,109,.5)}
.fb .fi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.fb.ok .fi{background:var(--ok)}.fb.bad .fi{background:var(--bad)}
.fb b{font:700 15px Unbounded,Manrope,sans-serif;display:block}
.fb .ex{font-size:14px;margin-top:3px;color:rgba(240,244,255,.9)}
.fb .tp{font-size:13px;margin-top:6px;color:var(--b3);font-weight:700}
.fb .pts{margin-left:auto;font:800 20px Unbounded,Manrope,sans-serif;color:var(--gold);white-space:nowrap}
.spkbtn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);display:grid;place-items:center;cursor:pointer}
.spkbtn .ic{width:17px;height:17px}
.floatpts{position:fixed;z-index:95;font:800 34px Unbounded,Manrope,sans-serif;color:var(--gold);pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.6);animation:fup 1.3s forwards}
@keyframes fup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-20px) scale(1.15);opacity:1}100%{transform:translate(-50%,-110px);opacity:0}}
.blitzq{position:absolute;z-index:7;left:50%;top:84px;transform:translateX(-50%);padding:9px 18px;border-radius:999px;font:800 13px Unbounded,Manrope,sans-serif;letter-spacing:1px;color:var(--ink);background:linear-gradient(90deg,#FFE27A,var(--gold),#FFE27A);background-size:200% 100%;animation:shine 1.2s linear infinite,dlgIn .4s both;box-shadow:0 8px 30px rgba(255,201,60,.5)}
@keyframes shine{to{background-position:-200% 0}}

/* intro / results card */
.center-card{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:92vh;overflow:auto;padding:26px;border-radius:28px;
 background:linear-gradient(180deg,rgba(14,20,42,.82),rgba(8,12,28,.9));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.6);text-align:center;animation:ccpop .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes ccpop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}}
.center-card h2{font:800 clamp(22px,3.4vw,30px) Unbounded,Manrope,system-ui,sans-serif;line-height:1.15}
.center-card .lead{color:var(--muted);margin-top:8px;font-size:15px;line-height:1.5}
.bigstars{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.bigstars .ic{width:54px;height:54px;fill:rgba(255,255,255,.12);stroke:none;transform:scale(.4);opacity:0;animation:starIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars .ic:nth-child(2){width:68px;height:68px;margin-top:-12px}
.bigstars .ic.on{fill:var(--gold);filter:drop-shadow(0 0 16px rgba(255,201,60,.8))}
@keyframes starIn{to{transform:scale(1);opacity:1}}
.res-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.res-kpis div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 6px}
.res-kpis b{display:block;font:800 22px Unbounded,Manrope,sans-serif}
.res-kpis small{font-size:11.5px;color:var(--muted);font-weight:700}
.xpgain{background:linear-gradient(135deg,rgba(255,201,60,.16),rgba(255,176,32,.06));border:1px solid rgba(255,201,60,.35);border-radius:18px;padding:14px 16px;text-align:left}
.xpgain .top{display:flex;align-items:center;justify-content:space-between;font-weight:800}
.xpgain .top b{font:800 22px Unbounded,Manrope,sans-serif;color:var(--gold)}
.xpgain .xpbar{width:100%;height:10px;margin-top:10px}
.xpgain small{display:block;margin-top:6px;font-size:12px;color:var(--muted);font-weight:700}
.mist-list{text-align:left;margin-top:14px}
.mist-list details{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px}
.mist-list summary{cursor:pointer;font-weight:800;font-size:14px}
.mitem{border-top:1px solid rgba(255,255,255,.08);padding:10px 0 2px;font-size:14px;line-height:1.5}
.mitem .q{font-weight:700}.mitem .y{color:#ff8fa3}.mitem .r{color:#5ee0a6}.mitem .t{color:var(--b3);font-size:13px}
.cc-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cc-btns .btn{flex:1}
.intro-ico{width:72px;height:72px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 12px 30px rgba(3,137,255,.5)}
.intro-ico .ic{width:36px;height:36px;color:#fff}
.intro-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.intro-list div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.intro-list b{display:block;font:800 16px Unbounded,Manrope,sans-serif;color:#fff}

/* ---------- modal / toasts ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(3,6,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s both;padding:16px}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;padding:24px;border-radius:26px;background:linear-gradient(180deg,rgba(16,22,46,.94),rgba(9,13,30,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.6);animation:mIn .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.97)}}
.mbox h2{font:800 24px Unbounded,Manrope,sans-serif}
.mbox .x{position:absolute;top:14px;right:14px}
.field{margin-top:16px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--b3);margin-bottom:8px}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:700 16px Manrope,Manrope,system-ui,sans-serif;outline:none}
.field input:focus{border-color:var(--b2);box-shadow:0 0 0 3px rgba(3,137,255,.25)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:11px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
.seg button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.seg button.on{background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent;box-shadow:0 6px 18px rgba(3,137,255,.4)}
.seg button.on small{color:rgba(255,255,255,.85)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.toggle b{font-size:14px;display:block}.toggle small{font-size:12px;color:var(--muted)}
.sw{position:relative;width:48px;height:28px;border-radius:28px;background:rgba(255,255,255,.15);border:0;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:18px;background:linear-gradient(135deg,rgba(18,24,50,.95),rgba(10,14,32,.95));border:1px solid rgba(255,201,60,.45);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(255,201,60,.18);animation:tIn .6s cubic-bezier(.2,1.4,.4,1) both;min-width:260px}
.toast.out{animation:tOut .4s forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-20px) scale(.9)}}
@keyframes tOut{to{opacity:0;transform:translateY(-14px)}}
.toast .md{width:46px;height:50px;position:relative;display:grid;place-items:center}
.toast .md svg.hex{position:absolute;inset:0;width:100%;height:100%}
.toast .md .ic{position:relative;color:#fff;width:22px;height:22px}
.toast small{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase}
.toast b{font-size:14px}
.lvlup{text-align:center}
.lvlup .big{font:800 86px/1 Unbounded,Manrope,system-ui,sans-serif;background:linear-gradient(180deg,#FFE27A,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px rgba(255,176,32,.5));margin:10px 0}
.unl{display:flex;align-items:center;gap:12px;text-align:left;margin-top:14px;padding:12px;border-radius:16px;background:rgba(91,200,250,.1);border:1px solid rgba(91,200,250,.3)}
.unl .th{width:86px;height:54px;border-radius:12px;background:#111 center/cover;flex:none}

footer.site{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--faint);padding:22px 16px 26px;line-height:1.7;border-top:1px solid rgba(255,255,255,.06);background:#050914}
footer.site b{color:var(--muted)}

/* ---------- race setup (restyled) ---------- */
.rs-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding-bottom:30px}
.rs-hero{position:relative;border-radius:24px;overflow:hidden;height:clamp(200px,32vh,320px);margin:20px 0;border:1px solid rgba(255,255,255,.12);box-shadow:var(--sh)}
.rs-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.rs-hero .ht{position:absolute;left:24px;bottom:20px;right:24px;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.rs-hero h1{font:800 clamp(28px,5vw,52px) Unbounded,Manrope,system-ui,sans-serif;line-height:1}
.rs-hero p{color:rgba(240,244,255,.88);margin-top:8px;font-weight:600}
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode2{text-align:left;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.mode2 .ic{color:var(--b3);width:26px;height:26px}
.mode2 h4{font:700 15px Unbounded,Manrope,sans-serif;margin:8px 0 4px}
.mode2 p{font-size:12.5px;color:var(--muted);line-height:1.45}
.mode2.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,201,60,.14),rgba(3,137,255,.1));box-shadow:0 0 0 1px rgba(255,201,60,.4)}
.garage2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drv2{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px}
.drv2 canvas{width:100%;height:110px;display:block;border-radius:12px;background:radial-gradient(circle at 50% 120%,rgba(91,200,250,.3),transparent 70%)}
.drv2 .who{font:700 11px Unbounded,Manrope,sans-serif;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.drv2 input{width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:700 15px Manrope,Manrope,system-ui,sans-serif;outline:none}
.swatch{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.swatch button{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer}
.swatch button.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.themes2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme2{height:78px;border-radius:14px;border:2px solid transparent;cursor:pointer;font-weight:800;font-size:12px;display:flex;align-items:flex-end;justify-content:center;padding:7px;text-shadow:0 2px 8px rgba(0,0,0,.8);color:#fff}
.theme2.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.3)}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--b3);margin:16px 0 8px}
.lbl:first-child{margin-top:0}

/* ---------- responsive ---------- */
@media (max-width:1100px){
 .dash,.city-body{grid-template-columns:1fr}
 .mapgrid{grid-template-columns:1fr}
}
@media (max-width:900px){
 .nav{display:none}
 .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;justify-content:space-around;padding:6px;border-radius:20px;background:rgba(10,15,32,.82);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 40px rgba(0,0,0,.5)}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:7px 4px;border-radius:14px;font-size:10.5px;font-weight:800;color:var(--muted);cursor:pointer}
 .bnav button.on{color:#fff;background:rgba(3,137,255,.25)}
 #app{padding-bottom:84px}
 .stat-pill.hide-m,.pchip .meta{display:none}
 .pchip{padding:4px}
 .rs-grid{grid-template-columns:1fr}
 .dlg{left:50%;transform:translateX(-50%);width:min(720px,94vw);animation:dlgIn2 .45s cubic-bezier(.2,.8,.2,1) both}
 @keyframes dlgIn2{from{opacity:0;transform:translate(-50%,24px)}}
 .npc{right:-4vw;bottom:auto;top:58px;height:min(46vh,430px)}
}
@media (max-width:600px){
 .brand small{display:none}
 .hero{min-height:38vh}
 .loc-grid{grid-template-columns:1fr 1fr;gap:10px}
 .lcard{aspect-ratio:4/5}
 .lcard.big{aspect-ratio:4/3}
 .lcard h4{font-size:14px}
 .lcard .sub{font-size:11.5px}
 .lcard .ico{width:32px;height:32px}
 .opts2{grid-template-columns:1fr;gap:8px}
 .opts2.art{grid-template-columns:repeat(3,1fr)}
 .o2{padding:12px 12px 12px 44px}
 .dlg{padding:14px;border-radius:22px}
 .say{font-size:17px}
 .chud .ttl{display:none}
 .dots i{width:14px}
 .garage2,.modes2{grid-template-columns:1fr}
 .themes2{grid-template-columns:repeat(2,1fr)}
 .res-kpis b{font-size:18px}
}

body.v-loc .bnav,body.v-loc .toasts{display:none}
body.v-loc .toasts{display:flex}
@media (max-width:900px){.dlg{max-height:calc(100vh - 86px);overflow:auto}}

body.racing .bnav{display:none!important}
.lockov{position:absolute;inset:auto;top:12px;right:12px;z-index:3;display:block}
.lockov>div{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(5,9,20,.75);border:1px solid rgba(255,255,255,.18)}
.lockov .lk{width:auto;height:auto;margin:0;border:0;background:none}
.lockov .lk .ic{width:15px;height:15px}
.lockov small{color:#fff;font-size:11px}

body.racing #fx,body.racing .toasts{z-index:300}
.modal{z-index:400}

/* ---------- RACE ---------- */
#race{position:fixed;inset:0;z-index:20;background:#05070f;display:grid;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#race.solo{grid-template-rows:57% 43%;grid-template-areas:"cv" "p1"}
#race.duel{grid-template-rows:57% 43%;grid-template-columns:1fr 1fr;grid-template-areas:"cv cv" "p1 p2"}
@media (orientation:portrait){
 #race.duel{grid-template-rows:1fr 32% 1fr;grid-template-columns:1fr;grid-template-areas:"p2" "cv" "p1"}
 #race.duel .pan.p2{transform:rotate(180deg)}
}
.cvwrap{grid-area:cv;position:relative;min-height:0}
#gc{position:absolute;inset:0;width:100%;height:100%;display:block}
.pause{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;z-index:3}
.pan{min-height:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-top:4px solid var(--c)}
.pan.p1{grid-area:p1}.pan.p2{grid-area:p2}
#race.duel .pan.p1{border-right:1px solid rgba(255,255,255,.06)}
.phead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.phead .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phead .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.phead .sp{flex:1}
.phead .pos{font:800 15px Unbounded;color:var(--gold)}
.phead .kmh{font:700 13px Unbounded;opacity:.9;min-width:78px;text-align:right}
.phead .stk{color:var(--gold);min-width:34px}
.qbox{position:relative;flex:1;min-height:0;background:#fff;color:var(--ink);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:box-shadow .2s}
.qbox.gold{box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,201,60,.6)}
.qtag{align-self:flex-start;font-weight:800;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:#EFF5FF;color:var(--b1)}
.qtag.g{background:#FFF1E6;color:#C2410C}.qtag.gold{background:var(--gold);color:var(--ink)}
.qtext{font-weight:800;font-size:clamp(15px,2.6vh,22px);line-height:1.3}
.gap{display:inline-block;min-width:48px;border-bottom:3px solid var(--b2);margin:0 3px;transform:translateY(-3px)}
.qnoun{font:800 clamp(24px,5vh,44px) Unbounded;text-align:center;flex:1;display:grid;place-items:center;word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;min-height:clamp(38px,6vh,56px);padding:6px 10px 6px 30px;border-radius:12px;border:2px solid #E2E8F0;background:#F8FAFC;color:var(--ink);font-weight:800;font-size:clamp(13px,2.1vh,18px);text-align:left;cursor:pointer;line-height:1.2;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt .kh{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:var(--b1);color:#fff;font-size:10px;display:grid;place-items:center}
.opts.one .opt{font-size:clamp(12px,1.9vh,16px)}
.opts.art{grid-template-columns:repeat(3,1fr)}
.opts.art .opt{text-align:center;padding:6px;font:800 clamp(18px,3.4vh,28px) Unbounded;color:#fff;border:0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.opt.der{background:#2563EB}.opt.die{background:#E11D48}.opt.das{background:#16A34A}
.opt.right{background:#DCFCE7!important;border-color:var(--ok)!important;color:#065F46!important}
.opt.wrong{background:#FFE4E6!important;border-color:var(--bad)!important;color:#9F1239!important}
.flash{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;font:800 clamp(18px,3.6vh,30px) Unbounded;opacity:0;pointer-events:none;transition:opacity .15s}
.flash.show{opacity:1}
.flash.ok{background:rgba(22,196,127,.93);color:#fff}
.flash.bad{background:rgba(255,77,109,.95);color:#fff}
.flash small{display:block;font:700 clamp(13px,2.2vh,17px) Manrope;margin-top:6px}
.flash .tp{display:block;font:600 12px Manrope;margin-top:6px;opacity:.95}
.wait{flex:1;display:grid;place-items:center;font:800 18px Unbounded;color:#64748B;text-align:center}
.ovl{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.lights{display:flex;gap:12px;background:rgba(0,0,0,.65);padding:12px 16px;border-radius:18px}
.lights i{width:clamp(26px,6vh,46px);height:clamp(26px,6vh,46px);border-radius:50%;background:#2a2a2a;box-shadow:inset 0 0 0 3px #111}
.lights i.r{background:#ff2d2d;box-shadow:0 0 22px #ff2d2d}.lights i.g{background:#22e37a;box-shadow:0 0 26px #22e37a}
.cnum{font:800 clamp(40px,12vh,96px) Unbounded;text-align:center;margin-top:8px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.banner{font:800 clamp(22px,6vh,52px) Unbounded;color:var(--gold);text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.8);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.pmenu{position:absolute;inset:0;z-index:30;background:rgba(5,7,15,.82);display:grid;place-items:center}
.pmenu .box{text-align:center}
.pmenu h2{font:800 34px Unbounded;margin-bottom:16px}
.pmenu button{display:block;width:240px;margin:10px auto;padding:15px;border-radius:14px;border:0;font:800 16px Unbounded;cursor:pointer}



table.stats{width:100%;border-collapse:collapse;text-align:left;color:var(--ink);background:#fff}
.stats th{background:var(--ink);color:#fff;padding:11px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.stats td{padding:11px 12px;border-top:1px solid #E2E8F0;font-weight:700;font-size:14px}
.stats tr:nth-child(even) td{background:#F8FAFC}
.mono{font-family:ui-monospace,Menlo,monospace;color:var(--b1);white-space:nowrap}
.b-gold{background:linear-gradient(90deg,var(--gold),#FFE58A);color:var(--ink)}
.b-ghost{background:rgba(255,255,255,.1);color:#fff}
/* ================= BLITZ RALLY 3D ================= */
.r3d{position:fixed;inset:0;z-index:200;background:#05070f;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Manrope,system-ui,sans-serif;color:#fff}
.r3d canvas.main{position:absolute;inset:0;width:100%;height:100%;display:block}
.r3d .load{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#16245a,#05070f 70%);z-index:30;transition:opacity .5s}
.r3d .load b{font:800 22px Unbounded,Manrope,sans-serif;display:block;margin-top:14px}
.r3d .load .bar{width:220px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px auto 0}
.r3d .load .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--b2),var(--b3));animation:ldb 1.1s ease-in-out infinite}
@keyframes ldb{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.speedfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(91,200,250,.0) 55%,rgba(180,230,255,.28) 100%)}
.speedfx.on{opacity:1;animation:sfx .25s linear infinite}
@keyframes sfx{50%{transform:scale(1.02)}}
.hitfx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,70,.55));transition:opacity .25s}
.hitfx.on{opacity:1}
.okfx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(22,196,127,.45));transition:opacity .25s}
.okfx.on{opacity:1}
.gl3{background:linear-gradient(180deg,rgba(12,18,40,.72),rgba(6,10,24,.78));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.rh-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:flex-start;z-index:5;pointer-events:none}
.rh-pos{padding:8px 14px;text-align:center;min-width:86px}
.rh-pos b{font:800 34px/1 Unbounded,Manrope,sans-serif;color:var(--gold)}
.rh-pos b small{font-size:16px;color:#fff;opacity:.8}
.rh-pos span{display:block;font-size:10px;font-weight:800;letter-spacing:1.6px;opacity:.7;margin-top:3px}
.rh-prog{flex:1;padding:10px 14px;min-width:0}
.rh-prog .row{display:flex;justify-content:space-between;font:700 12px Unbounded,Manrope,sans-serif;opacity:.9}
.rh-prog .tr{position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:8px}
.rh-prog .tr .gt{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:rgba(255,255,255,.35)}
.rh-prog .tr .pd{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;transition:left .15s linear;box-shadow:0 0 8px rgba(0,0,0,.6)}
.rh-prog .tr .pd.me{width:18px;height:18px;margin:-9px 0 0 -9px;z-index:2;box-shadow:0 0 0 3px rgba(255,201,60,.6)}
.rh-spd{padding:8px 14px;text-align:right;min-width:120px}
.rh-spd b{font:800 32px/1 Unbounded,Manrope,sans-serif}
.rh-spd span{font-size:11px;font-weight:800;opacity:.7}
.rh-spd .sb{height:5px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.rh-spd .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--b2),var(--b3),var(--gold));transition:width .1s}
.rh-btn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,28,.6)}
.rh-q{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(700px,70vw);padding:10px 12px;z-index:5;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s}
.rh-q.hide{opacity:0;transform:translate(-50%,-14px)}
.rh-q .qh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--b3)}
.rh-q .qh .d{margin-left:auto;color:#fff;font-family:Unbounded,Manrope,sans-serif;letter-spacing:0}
.rh-q .qt{font-weight:800;font-size:clamp(15px,1.8vw,19px);line-height:1.3;margin-top:5px}
.rh-q .qt .gap{display:inline-block;min-width:50px;border-bottom:3px solid var(--b3);margin:0 3px;transform:translateY(-3px)}
.rh-q .qo{display:grid;gap:7px;margin-top:9px}
.rh-q .qo div{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:12px;font-weight:800;font-size:clamp(12.5px,1.5vw,15px);line-height:1.2;background:rgba(255,255,255,.06);border:2px solid transparent;min-width:0}
.rh-q .qo div i{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font:800 13px Unbounded,Manrope,sans-serif;font-style:normal;color:#fff}
.rh-q .qo div.lane{border-color:#fff;background:rgba(255,255,255,.14)}
.rh-lb{position:absolute;right:10px;top:92px;width:210px;padding:10px;z-index:4;pointer-events:none}
.rh-lb .t{font-size:10px;font-weight:800;letter-spacing:1.6px;opacity:.7;margin-bottom:6px}
.rh-lb .e{display:grid;grid-template-columns:20px 10px 1fr auto;gap:7px;align-items:center;font-size:13px;font-weight:700;padding:4px 2px;border-radius:8px}
.rh-lb .e.me{background:rgba(255,201,60,.16)}
.rh-lb .e b{font-family:Unbounded,Manrope,sans-serif;font-size:12px;color:var(--gold)}
.rh-lb .e .c{width:10px;height:10px;border-radius:50%}
.rh-lb .e .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rh-lb .e small{font-size:11px;opacity:.75;font-family:ui-monospace,Menlo,monospace}
.rh-center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;text-align:center;pointer-events:none}
.cd-lights{display:flex;gap:12px;justify-content:center;padding:12px 16px}
.cd-lights i{width:44px;height:44px;border-radius:50%;background:#262626;box-shadow:inset 0 0 0 3px #111}
.cd-lights i.r{background:#ff2d2d;box-shadow:0 0 26px #ff2d2d}.cd-lights i.g{background:#22e37a;box-shadow:0 0 30px #22e37a}
.cd-num{font:800 clamp(60px,14vw,130px)/1 Unbounded,Manrope,sans-serif;text-shadow:0 8px 40px rgba(0,0,0,.6);margin-top:10px}
.fbk{font:800 clamp(26px,5vw,48px) Unbounded,Manrope,sans-serif;text-shadow:0 6px 30px rgba(0,0,0,.65);animation:fbk .9s cubic-bezier(.2,1.4,.4,1) both}
.fbk.ok{color:#4ade80}.fbk.bad{color:#ff6b81}
.fbk small{display:block;font:700 clamp(14px,2vw,18px) Manrope;color:#fff;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.fbk small.tip{color:var(--b3);font-size:14px}
@keyframes fbk{from{transform:scale(.5);opacity:0}}
.rh-msg{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;padding:10px 16px;font-weight:800;font-size:14px;pointer-events:none;white-space:nowrap}
.tc{position:absolute;bottom:18px;z-index:7;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(10,15,32,.45);border:2px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
.tc.on{background:rgba(3,137,255,.45);border-color:#fff}
.tc svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tc.l{left:18px}.tc.r{right:18px}
.tc.br{left:50%;transform:translateX(-50%);width:76px;height:76px;bottom:28px;font:800 12px Unbounded,Manrope,sans-serif}
.r3d .res{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,6,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px;overflow:auto}
.r3d .res .box{width:min(640px,100%);padding:22px;text-align:center;border-radius:26px;animation:fbk .6s both}
.r3d .res h2{font:800 clamp(24px,4.5vw,40px) Unbounded,Manrope,sans-serif}
.pod3{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0 12px}
.pod3 div{width:min(30%,160px)}
.pod3 b{display:block;font-weight:800;font-size:14px;margin-bottom:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pod3 span{display:grid;place-items:center;border-radius:14px 14px 0 0;font:800 26px Unbounded,Manrope,sans-serif}
.res table{width:100%;border-collapse:collapse;text-align:left;font-size:13.5px;border-radius:14px;overflow:hidden;background:#fff;color:#0F172A;margin-top:6px}
.res th{background:#0F172A;color:#fff;padding:9px 10px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.res td{padding:9px 10px;border-top:1px solid #E2E8F0;font-weight:700}
.res tr:nth-child(even) td{background:#F8FAFC}
.res tr.me td{background:#FFF7DB}
.res .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.res .acts .btn{flex:1}
.res details{margin-top:12px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.res summary{font-weight:800;cursor:pointer;font-size:14px}
.pmenu3{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(3,6,16,.6)}
.pmenu3 .box{padding:22px;text-align:center;width:min(380px,92vw)}
.pmenu3 h2{font:800 26px Unbounded,Manrope,sans-serif;margin-bottom:14px}
.pmenu3 .btn{width:100%;margin-top:10px}
/* lobby */
.carpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.carpick button{padding:10px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);cursor:pointer;font-weight:800;font-size:13px;text-align:center}
.carpick button small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.carpick button.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,201,60,.16),rgba(3,137,255,.12));box-shadow:0 0 0 1px rgba(255,201,60,.4)}
.codebox{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(37,41,216,.35),rgba(3,137,255,.2));border:1px solid rgba(91,200,250,.4)}
.codebox b{font:800 36px Unbounded,Manrope,sans-serif;letter-spacing:6px}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d,type='sine',when=0,vol=.12){if(!S.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

 const s=a.createBufferSource();s.buffer=NB;const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;const t=a.currentTime;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}catch(e){}}

function engineSet(r){if(!ENG)return;const t=ENG.a.currentTime;ENG.o.frequency.setTargetAtTime(42+78*r,t,.08);ENG.o2.frequency.setTargetAtTime(21+39*r,t,.08)}
function engineStop(){if(!ENG)return;try{const t=ENG.a.currentTime;ENG.g.gain.setTargetAtTime(.0001,t,.05);ENG.o.stop(t+.3);ENG.o2.stop(t+.3)}catch(e){}ENG=null}

/* ================= TRACK ================= */
const SEG=200,ROADW=2000,N=720,DRAW=170,CAMH=1500,DEPTH=.84,FOLLOW=1900,CARW=900,BASE=2400,UPM=72,START_Z=300;
let segs=[],STARS=[],CITY=[];
const segAt=i=>segs[((i%N)+N)%N];
function buildTrack(theme){
 const T=THEMES[theme];segs=[];
 for(let i=0;i<N;i++){const c=Math.sin(2*Math.PI*5*i/N)+.5*Math.sin(2*Math.PI*11*i/N+1);
  const curve=Math.abs(c)<.4?0:(c>0?c-.4:c+.4)*5.5;
  const y=1500*Math.sin(2*Math.PI*3*i/N)+500*Math.sin(2*Math.PI*8*i/N);
  segs.push({curve,y,sp:[]})}
 for(let i=8;i<N;i+=5){const side=(i%10)?1:-1;
  if(i%55===3)segs[i].sp.push({t:'board',off:side*1.75,text:BOARDS[Math.floor(Math.random()*BOARDS.length)]});
  else segs[i].sp.push({t:T.props[Math.floor(Math.random()*T.props.length)],off:side*(1.4+Math.random()*.6)});
  if(Math.random()<.45&&T.props[0]!=='lamp')segs[(i+2)%N].sp.push({t:T.props[Math.floor(Math.random()*T.props.length)],off:-side*(1.6+Math.random()*1.4)})}
 STARS=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,tw:Math.random()*6}));
 CITY=[];let x=0;while(x<1.6){const w=.02+Math.random()*.045,h=.05+Math.random()*.2;const win=[];for(let k=0;k<30;k++)win.push([Math.random(),Math.random(),Math.random()<.55]);CITY.push({x,w,h,win,tw:Math.random()<.12});x+=w+.004}
}
const segY=z=>{const i=Math.floor(z/SEG),p=(z-i*SEG)/SEG;return lerp(segAt(i).y,segAt(i+1).y,p)};

/* ================= RACE STATE ================= */
let R=null;
function newCar(i,isBot){
 const P=S.p[i]||{};const pool=shuffle(DB[S.level].filter(inCat));
 return{i,isBot,name:isBot?'Blitz-Bot':((P.name||'').trim().slice(0,14)||'Spieler '+(i+1)),color:isBot?'#94A3B8':CAR_COLORS[P.col],
  z:START_Z,speed:0,boostT:0,mega:false,spinT:0,streak:0,best:0,correct:0,total:0,top:0,lane:i===0?-.5:.5,
  pool,pi:0,q:null,opts:[],right:'',gold:false,locked:true,finished:false,ft:0,botT:3+Math.random()*2,sx:0,sy:0,sw:0,vis:false}
}
function startRace(){
 ac();buildTrack(S.theme);
 const duel=S.mode==='duel';
 R={cars:[newCar(0,false),newCar(1,!duel)],duel,t:0,phase:'count',cd:4.2,lastBeep:5,order:[],fx:[],parts:[],skyOff:0,fov:0,mist:[],paused:false,running:true,lastTs:0,uiT:0,shake:0,endT:0,len:S.len*UPM};
 document.body.classList.add('racing');
 $('#raceRoot').innerHTML=`<div id="race" class="${duel?'duel':'solo'}">
  <div class="cvwrap"><canvas id="gc"></canvas><button class="pause" onclick="togglePause()">⏸</button><div class="ovl" id="ovl"></div></div>
  ${panHTML(0)}${duel?panHTML(1):''}</div>`;
 R.cars.forEach((c,i)=>{if(!c.isBot){const p=$('#pan'+i);p.addEventListener('pointerdown',e=>{const b=e.target.closest('.opt');if(!b)return;e.preventDefault();answerCar(i,+b.dataset.i)})}});
 engineStart();

}
function panHTML(i){const c=R.cars[i];return `<div class="pan p${i+1}" id="pan${i}" style="--c:${c.color}">
 <div class="phead"><span class="nm"><span class="dot"></span>${esc(c.name)}</span><span class="stk" id="stk${i}"></span><span class="sp"></span><span class="pos" id="pos${i}">–</span><span class="kmh" id="kmh${i}">0 km/h</span></div>
 <div class="qbox" id="qb${i}"><div class="wait">Motor an… 🏁</div></div></div>`}

function nextQ(c){
 if(c.pi>=c.pool.length){c.pool=shuffle(c.pool);c.pi=0}
 const q=c.pool[c.pi++];c.q=q;c.gold=Math.random()<.12;
 if(q.t==='mc'){c.opts=shuffle(q.o);c.right=q.o[0]}
 else if(q.t==='art'){c.opts=['der','die','das'];c.right=q.a}
 else{const toks=q.s.replace(/[.?!]$/,'').split(' '),pn=(q.s.match(/[.?!]$/)||[''])[0],right=toks.join(' ')+pn;
  const cand=[];for(let k=0;k<toks.length-1;k++){const t=toks.slice();[t[k],t[k+1]]=[t[k+1],t[k]];const s=t.join(' ')+pn;if(s!==right&&!cand.includes(s))cand.push(s)}
  const pref=shuffle(cand.filter(s=>s[0]===right[0])),rest=shuffle(cand.filter(s=>s[0]!==right[0]));
  c.opts=shuffle([right,...pref.concat(rest).slice(0,2)]);c.right=right}
 c.locked=false;
 if(!c.isBot)renderQ(c);
}
function renderQ(c){
 const q=c.q,i=c.i,keys=i===0?['1','2','3','4']:['7','8','9','0'];
 const isG=q.t==='ord'||q.c==='G';
 const tag=c.gold?'⚡ Blitz-Frage · Turbo':q.t==='art'?'Artikel':q.t==='ord'?'Satzbau':isG?'Grammatik':'Wortschatz';
 let h=`<div class="qtag ${c.gold?'gold':isG?'g':''}">${tag}</div>`;
 if(q.t==='art')h+=`<div class="qnoun">${esc(q.n)}</div><div class="opts art">${c.opts.map((o,k)=>`<button class="opt ${o}" data-i="${k}">${o}</button>`).join('')}</div>`;
 else if(q.t==='ord')h+=`<div class="qtext">Welcher Satz ist richtig?</div><div class="opts one">${c.opts.map((o,k)=>`<button class="opt" data-i="${k}"><span class="kh">${keys[k]}</span>${esc(o)}</button>`).join('')}</div>`;
 else h+=`<div class="qtext">${fmt(q.q)}</div><div class="opts">${c.opts.map((o,k)=>`<button class="opt" data-i="${k}"><span class="kh">${keys[k]}</span>${esc(o)}</button>`).join('')}</div>`;
 h+=`<div class="flash" id="fl${i}"></div>`;
 const b=$('#qb'+i);b.innerHTML=h;b.classList.toggle('gold',c.gold);
}
function answerCar(i,k){
 if(!R||R.phase!=='run'||R.paused)return;const c=R.cars[i];if(c.locked||c.finished||c.isBot)return;
 c.locked=true;const val=c.opts[k],ok=val===c.right;
 document.querySelectorAll('#qb'+i+' .opt').forEach((b,j)=>{if(c.opts[j]===c.right)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
 applyResult(c,ok);
 const q=c.q,shown=q.t==='art'?`${q.a} ${q.n}`:c.right;
 if(!ok)R.mist.push({who:c.name,q:q.t==='art'?`___ ${q.n}`:q.t==='ord'?'Satzbau: Welcher Satz ist richtig?':q.q,your:val,right:shown,tip:q.tip||''});
 const fl=$('#fl'+i);
 setTimeout(()=>{if(!fl)return;fl.className='flash show '+(ok?'ok':'bad');
  fl.innerHTML=ok?(c.mega?'⚡ TURBO! ⚡':'🔥 NITRO!')+`<small>${esc(shown)}</small>`:`💥 Falsch!<small>✓ ${esc(shown)}</small>${q.tip?`<span class="tp">💡 ${esc(q.tip)}</span>`:''}`},ok?120:180);
 setTimeout(()=>{if(R&&!c.finished)nextQ(c)},ok?700:(q.tip?2300:1600));
}
function applyResult(c,ok){
 c.total++;
 if(ok){c.correct++;c.streak++;c.best=Math.max(c.best,c.streak);const mega=c.gold||c.streak%3===0;
  c.mega=mega;c.boostT=mega?3.4:Math.min(4,Math.max(c.boostT,0)+2.1);c.spinT=0;
  R.fx.push({car:c.i,text:mega?'TURBO!':'NITRO!',col:mega?'#5BC8FA':'#FFC93C',t:0});
  if(!c.isBot||!R.duel)sNitro(mega)}
 else{c.streak=0;c.boostT=0;c.mega=false;c.spinT=1.7;R.fx.push({car:c.i,text:'💥',col:'#FF4D6D',t:0});if(c.i===followIdx())R.shake=.5;sSkid()}
}
function followIdx(){if(!R.duel)return 0;const a=R.cars[0],b=R.cars[1];if(a.finished&&!b.finished)return 1;if(b.finished&&!a.finished)return 0;return a.z<=b.z?0:1}

/* ================= LOOP ================= */
function frame(ts){
 if(!R||!R.running)return;
 const dt=R.lastTs?Math.min(.05,(ts-R.lastTs)/1000):0;R.lastTs=ts;
 if(!R.paused)update(dt);
 if(!R||!R.running)return;
 render(dt);
 requestAnimationFrame(frame);
}
function update(dt){
 R.t+=dt;
 if(R.phase==='count'){
  R.cd-=dt;const n=Math.ceil(R.cd);
  if(n!==R.lastBeep&&n<=3&&n>=1){sBeep(false);R.lastBeep=n}
  if(R.cd<=0){R.phase='run';R.t=0;sBeep(true);R.cars.forEach(c=>nextQ(c));R.goT=1.2}
  showCount();return}
 if(R.goT>0){R.goT-=dt;if(R.goT<=0)$('#ovl').innerHTML='';else showCount()}
 const bot=BOTS[S.bot];
 R.cars.forEach(c=>{
  if(c.isBot&&R.phase==='run'&&!c.finished){c.botT-=dt;if(c.botT<=0){applyResult(c,Math.random()<bot.acc);c.botT=bot.int*(.7+Math.random()*.6)}}
  const tgt=c.spinT>0?BASE*.32:c.boostT>0?BASE*(c.mega?2.25:1.8):BASE;
  c.speed+=(tgt-c.speed)*Math.min(1,dt*(tgt>c.speed?(c.boostT>0?3:1.1):4));
  c.z+=c.speed*dt;c.top=Math.max(c.top,c.speed);
  if(c.boostT>0){c.boostT-=dt;if(c.boostT<=0)c.mega=false}
  if(c.spinT>0)c.spinT-=dt;
  if(!c.finished&&c.z-START_Z>=R.len){c.finished=true;c.ft=R.t;c.locked=true;R.order.push(c.i);onFinish(c)}
 });
 if(R.phase==='finish'){R.endT-=dt;if(R.endT<=0||(R.cars.every(c=>c.finished)&&R.endT<1.8)){showResults();return}}
 const f=R.cars[followIdx()];
 R.skyOff+=segAt(Math.floor(f.z/SEG)).curve*(f.speed/BASE)*dt*.0035;
 R.fov=lerp(R.fov,f.boostT>0?(f.mega?1:.6):0,Math.min(1,dt*3));
 if(R.shake>0)R.shake-=dt;
 R.fx.forEach(x=>x.t+=dt);R.fx=R.fx.filter(x=>x.t<1.3);
 engineSet(f.speed/BASE);
 R.uiT-=dt;if(R.uiT<=0){R.uiT=.1;updUI()}
}
function onFinish(c){
 if(R.order.length===1){R.phase='finish';R.endT=3;sFanfare();
  $('#ovl').innerHTML=`<div class="banner">🏁 ${esc(c.name)} gewinnt!</div>`;
  R.cars.forEach(o=>{o.locked=true;if(!o.isBot){const b=$('#qb'+o.i);if(b)b.innerHTML=`<div class="wait">${o===c?'🏆 1. Platz!':'🏁 Ziel… '}</div>`}})}
}
function showCount(){
 const n=Math.ceil(R.cd);const on=R.phase==='run'?3:clamp(4-n,0,3);
 $('#ovl').innerHTML=`<div><div class="lights">${[0,1,2].map(k=>`<i class="${R.phase==='run'?'g':k<on?'r':''}"></i>`).join('')}</div><div class="cnum">${R.phase==='run'?'LOS!':n<=3?n:''}</div></div>`;
}
function ranks(){return R.cars.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.ft-b.ft;if(a.finished)return -1;if(b.finished)return 1;return b.z-a.z})}
function updUI(){
 const rk=ranks();
 R.cars.forEach(c=>{if(c.isBot)return;const kmh=Math.round(c.speed/BASE*120);
  $('#kmh'+c.i).textContent=kmh+' km/h';$('#pos'+c.i).textContent=(rk.indexOf(c)+1)+'.';
  $('#stk'+c.i).textContent=c.streak>=2?'🔥'+c.streak:''});
}

/* ================= RENDER ================= */
let cv,g,W,H,K,HZ,dpr;
function render(dt){
 cv=$('#gc');if(!cv)return;g=cv.getContext('2d');dpr=Math.min(2,window.devicePixelRatio||1);
 const cw=Math.round(cv.clientWidth*dpr),ch=Math.round(cv.clientHeight*dpr);if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch}
 W=cw;H=ch;if(!W||!H)return;K=Math.min(W,H*1.6)/2;HZ=H*.42;
 const T=THEMES[S.theme],fi=followIdx(),fc=R.cars[fi];
 g.save();
 if(R.shake>0)g.translate((Math.random()-.5)*14*dpr*R.shake,(Math.random()-.5)*10*dpr*R.shake);
 drawBg(T);
 const depth=DEPTH*(1-.16*R.fov);
 const camZ=fc.z-FOLLOW,camY=CAMH+segY(fc.z);
 const proj=(wx,wy,wz)=>{const sc=depth/wz;return{x:W/2+sc*wx*K,y:HZ-sc*(wy-camY)*K,w:sc*ROADW*K,s:sc}};
 const bi=Math.floor(camZ/SEG),bp=(camZ-bi*SEG)/SEG;
 let x=0,dx=-(segAt(bi).curve*bp),maxy=H;const list=[];
 const finIdx=Math.floor((START_Z+R.len)/SEG),startIdx=Math.floor(START_Z/SEG)+1;
 for(let n=0;n<DRAW;n++){
  const idx=bi+n,s=segAt(idx),s2=segAt(idx+1),z1=idx*SEG-camZ,z2=(idx+1)*SEG-camZ;
  if(z1<=60){x+=dx;dx+=s.curve;continue}
  const p1=proj(x,s.y,z1),p2=proj(x+dx,s2.y,z2);x+=dx;dx+=s.curve;
  list.push({idx,n,p1,p2,clip:maxy,s});
  if(p2.y>=p1.y||p2.y>=maxy)continue;
  drawSeg(T,p1,p2,idx,n,finIdx,startIdx);maxy=p2.y;
 }
 // sprites & cars back to front
 const carsBySeg={};R.cars.forEach(c=>{const k=Math.floor(c.z/SEG);(carsBySeg[k]=carsBySeg[k]||[]).push(c);c.vis=false});
 for(let k=list.length-1;k>=0;k--){
  const L=list[k];g.save();g.beginPath();g.rect(0,0,W,L.clip);g.clip();
  const u=L.p1.s*K;
  L.s.sp.forEach(sp=>drawProp(T,sp,L.p1.x+sp.off*L.p1.w,L.p1.y,u));
  if(L.idx===finIdx||L.idx===startIdx)drawGantry(L.p1,u,L.idx===finIdx);
  (carsBySeg[L.idx]||[]).sort((a,b)=>b.z-a.z).forEach(c=>{
   const pc=(c.z-L.idx*SEG)/SEG,px=lerp(L.p1.x,L.p2.x,pc),py=lerp(L.p1.y,L.p2.y,pc),pw=lerp(L.p1.w,L.p2.w,pc),sc=lerp(L.p1.s,L.p2.s,pc);
   const cw2=sc*CARW*K,cx2=px+c.lane*pw+Math.sin(R.t*2+c.i*3)*cw2*.02;
   const tilt=clamp(-L.s.curve*.012*(c.speed/BASE),-.12,.12);
   drawCar(g,cx2,py,cw2,c.color,{boost:c.boostT>0,mega:c.mega,spin:c.spinT>0,t:R.t,plate:c.isBot?'BOT':'BLITZ',tilt});
   c.sx=cx2;c.sy=py;c.sw=cw2;c.vis=true;
   if(c.spinT>0&&Math.random()<.6)R.parts.push({x:cx2+(Math.random()-.5)*cw2*.8,y:py-cw2*.1,vx:(Math.random()-.5)*40*dpr,vy:-30*dpr-Math.random()*40*dpr,r:cw2*.08,life:.9,c:'rgba(200,200,210,'});
   if(c.boostT>0&&Math.random()<.5)R.parts.push({x:cx2+(Math.random()<.5?-1:1)*cw2*.24,y:py-cw2*.12,vx:(Math.random()-.5)*60*dpr,vy:40*dpr+Math.random()*60*dpr,r:cw2*.025,life:.4,c:c.mega?'rgba(120,200,255,':'rgba(255,190,60,'});
   // name tag
   if(c.name){const fs=Math.max(10*dpr,Math.min(15*dpr,cw2*.12));g.font=`800 ${fs}px Manrope`;const tw=g.measureText(c.name).width;const ty=py-cw2*.66-fs*1.2;
   g.fillStyle=c.color;rr(g,cx2-tw/2-fs*.6,ty-fs*.75,tw+fs*1.2,fs*1.5,fs*.7);g.fill();g.fillStyle=c.color==='#E5E7EB'||c.color==='#FFC93C'?'#0F172A':'#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(c.name,cx2,ty);}
  });
  g.restore();
 }
 // particles
 R.parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r*=1+dt*1.5;g.fillStyle=p.c+Math.max(0,p.life)*.6+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});
 R.parts=R.parts.filter(p=>p.life>0);
 // speed lines

/* ================= SEEDED RNG / DATES ================= */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashStr=s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

const PKEY='blitzDE_profile_v1';
function defProfile(){return{name:'',lvl:'A1',xp:0,stars:{},best:{},visited:{berlin:true},lastCity:'berlin',
 stats:{answers:0,correct:0,art:0,gram:0,voc:0,sessions:0,perfect:0,bestStreak:0,races:0,wins:0,fast:0,night:0,early:0},
 ach:{},claimedXP:0,dayStreak:0,lastDay:null,daily:null,settings:{sound:true,tod:'auto',wx:'auto',unlockAll:false}}}
let P=defProfile();
function loadP(){try{const s=localStorage.getItem(PKEY);if(s){const o=JSON.parse(s),d=defProfile();P=Object.assign(d,o);P.stats=Object.assign(d.stats,o.stats||{});P.settings=Object.assign(d.settings,o.settings||{})}}catch(e){}}
function saveP(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}}
const plevel=()=>levelOf(P.xp);
const cityUnlocked=c=>P.settings.unlockAll||plevel()>=c.lvl;
const locUnlocked=l=>cityUnlocked(cityById(LOCS[l].city));
function ensureDaily(){
 const d=today();
 if(P.lastDay!==d){if(P.lastDay&&dayDiff(P.lastDay,d)===1)P.dayStreak=(P.dayStreak||0)+0;}
 if(!P.daily||P.daily.date!==d){
  const r=rng(hashStr(d+'blitz'));const pool=MISSIONS.slice();const pick=[];
  while(pick.length<3){const k=Math.floor(r()*pool.length);const m=pool.splice(k,1)[0];pick.push({id:m.id,goal:m.goals[Math.floor(r()*m.goals.length)],prog:0,claimed:false,seen:[]})}
  P.daily={date:d,m:pick};saveP();
 }
}
function markPlayedToday(){const d=today();if(P.lastDay===d)return;if(P.lastDay&&dayDiff(P.lastDay,d)===1)P.dayStreak=(P.dayStreak||0)+1;else P.dayStreak=1;P.lastDay=d}
function missionDef(id){return MISSIONS.find(m=>m.id===id)}
function bumpMission(id,v=1,mode='add',key){
 ensureDaily();P.daily.m.forEach(m=>{if(m.id!==id||m.prog>=m.goal)return;
  if(mode==='max')m.prog=Math.max(m.prog,v);
  else if(mode==='uniq'){if(!m.seen.includes(key)){m.seen.push(key);m.prog++}}
  else m.prog+=v;
  if(m.prog>=m.goal){m.prog=m.goal;toast('Tagesmission erfüllt',missionDef(m.id).n(m.goal),{c:['#047857','#34d399'],ic:'check',id:'m'})}})
}
function claimMission(i){const m=P.daily.m[i];if(!m||m.prog<m.goal||m.claimed)return;m.claimed=true;const xp=missionDef(m.id).xp;sCoin();addXP(xp,true);saveP();refreshTop();if(App.view==='home')viewHome(true)}
function addXP(n,celebrate){
 const before=plevel();P.xp+=n;saveP();const after=plevel();
 if(after>before&&celebrate!==false)setTimeout(()=>levelUp(before,after),celebrate==='late'?1800:300);
 checkAch();return{before,after};
}
function checkAch(){ACH.forEach(a=>{if(!P.ach[a.id]&&a.ok(P)){P.ach[a.id]=today();saveP();toast('Erfolg freigeschaltet',a.n,a)}})}

/* ================= FX (confetti) ================= */
const FX=(()=>{let cv,cx,parts=[],run=false;
 function init(){cv=document.getElementById('fx');cx=cv.getContext('2d');rs();addEventListener('resize',rs)}
 function rs(){if(!cv)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
 function burst(x,y,n=70,sp=1){if(!cv)return;const d=devicePixelRatio,cols=['#2529D8','#0389FF','#5BC8FA','#FFC93C','#FF4D6D','#16C47F','#ffffff'];
  for(let i=0;i<n;i++)parts.push({x:x*d,y:y*d,vx:(Math.random()-.5)*16*sp*d,vy:(-Math.random()*15-4)*d,g:.42*d,w:(4+Math.random()*6)*d,h:(7+Math.random()*8)*d,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.35,l:140});
  if(!run)loop()}
 function loop(){run=true;cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+60);if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
 function big(){[.2,.5,.8].forEach((f,i)=>setTimeout(()=>burst(innerWidth*f,innerHeight*.35,90,1.2),i*220))}
 return{init,burst,big}})();

const RC=(x,y,w,h,f,x2='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${x2}/>`;

const RGd=(id,st,cx=.5,cy=.5,r=.5)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${st.map((s,i)=>`<stop offset="${(i/(st.length-1)).toFixed(2)}" stop-color="${s[0]}" stop-opacity="${s[1]}"/>`).join('')}</radialGradient>`;
const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const skyFor=tod=>({dawn:['#5d5d9e','#f4c3a6','#fde3c4'],day:['#3c84e2','#9cc8f4','#e4effb'],dusk:['#3f2a72','#ec8060','#fbc68a'],night:['#050c26','#132758','#1f3566']})[tod];
function glowC(x,y,r,c,u,a=.55){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${u}gl)" opacity="${a}"/>`}
function skylineMini(x0,x1,base,tod,seed){const r=rng(seed);let s='',x=x0;const night=tod==='night'||tod==='dusk';while(x<x1){const w=20+r()*40,h=30+r()*110;s+=RC(x,base-h,w,h,night?'#0d1630':'#7d8ea6');

function go(view,arg){

 App.view=view;App.arg=arg;document.body.className='v-'+view;closeModal();stopSpeak();
 let city=P.lastCity||'berlin';
 if(view==='city'){city=arg;P.lastCity=arg;if(!P.visited[arg]){P.visited[arg]=true;saveP();checkAch()}saveP()}

}

function artTipUz(n,a){const w=NOUN_UZ[n]?` — ${NOUN_UZ[n]}`:'';const l=n.toLowerCase();let r='';

 else if(/(chen|lein)$/.test(l))r=`-${l.match(/(chen|lein)$/)[1]} bilan tugaydigan otlar doim das (hatto „das Mädchen“).`;
 else if(/(nis|um|ment)$/.test(l))r=`-${l.match(/(nis|um|ment)$/)[1]} bilan tugaydigan otlar ko'pincha das.`;

 else if(/^ge/.test(l)&&a==='das')r="Ge- bilan boshlanadigan otlar ko'pincha das.";

 else if(/(ling|ismus|or)$/.test(l))r="-ling, -ismus, -or bilan tugaydigan otlar der.";
 else if(/(haus|zimmer|bett|rad|glas)$/.test(l)&&a==='das')r=`Qo'shma so'zda artikl oxirgi so'zdan olinadi: das ${n.match(/(haus|zimmer|bett|rad|glas)$/i)[0].replace(/^./,c=>c.toUpperCase())}.`;
 else if(/(schrank|wagen|plan|saal|steig)$/.test(l))r=`Qo'shma so'zda artikl oxirgi so'zdan olinadi (der ${n.match(/(schrank|wagen|plan|saal|steig)$/i)[0].replace(/^./,c=>c.toUpperCase())}).`;
 else if(/(karte|vertrag)$/.test(l))r="Qo'shma so'zda artikl oxirgi so'zdan olinadi.";

function makeTrack(len,seed){
 const r=rng(seed^0x5eed),N=Math.ceil(len+420),px=new Float32Array(N+1),pz=new Float32Array(N+1),hd=new Float32Array(N+1),kv=new Float32Array(N+1);

 const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
 for(let i=0;i<=N;i++){const f=sm(i/240)*sm((len+180-i)/200);const k=f*(a1*Math.sin(i/p1+o1)+a2*Math.sin(i/p2+o2));kv[i]=k;h+=k;x+=Math.sin(h);z+=Math.cos(h);px[i]=x;pz[i]=z;hd[i]=h}
 const at=s=>{if(s<0)return{x:px[0]+Math.sin(hd[0])*s,z:pz[0]+Math.cos(hd[0])*s,h:hd[0],k:0};if(s>N-1){const e=s-(N-1);return{x:px[N-1]+Math.sin(hd[N-1])*e,z:pz[N-1]+Math.cos(hd[N-1])*e,h:hd[N-1],k:0}}const i=Math.floor(s),t=s-i;return{x:px[i]+(px[i+1]-px[i])*t,z:pz[i]+(pz[i+1]-pz[i])*t,h:hd[i]+(hd[i+1]-hd[i])*t,k:kv[i]}};
 const P=(s,o=0,y=0)=>{const a=at(s);return new THREE.Vector3(a.x+Math.cos(a.h)*o,y,a.z-Math.sin(a.h)*o)};
 return{N,len,at,P};
}

const MUS=(()=>{let on=false,nx=0,step=0,iv=0,out=null,hyp=false,hv=0,noise=null,dly=null;const BPM=126,S16=60/BPM/4;

 function sched(a){while(nx<a.currentTime+.15){const t=nx,st=step%16,bar=Math.floor(step/16),[root,ch]=PR[bar%4],sect=Math.floor(bar/4)%4,lift=hv>.5||sect>=2;
